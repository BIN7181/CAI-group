bio: |
  蔡亮，南京大学能源与资源学院助理教授、博士生导师。2012—2018 年于中国科学技术大学硕博连读获博士学位，2016—2018 年在美国威斯康星大学麦迪逊分校博士联合培养。此后先后在阿卜杜拉国王科技大学、新加坡国立大学从事博士后研究，2022—2024 年任东京工业大学特聘助理教授，2024 年起任职南京大学能源与资源学院。

  长期从事电解水制氢电极与器件研发，研究涵盖 AEM 电解水制氢电极与器件、PEM 电解水制氢催化材料与器件、电解水制氢耦合废塑料升级回收，以及工况与时间分辨 XAFS 谱学及应用。近年来以（共同）第一作者或通讯作者在 ACS Energy Letters、Nano Letters、ACS Catalysis 等期刊发表论文，其中 Fe3O4 界面硫化物碱性大电流析氧工作入选 ESI 高被引论文（引用 > 100 次）。

  现主持国家自然科学基金面上项目（2026—2029）、江苏省双碳专项项目课题（2025—2028）、江苏省科技计划面上项目（2025—2028）、南京大学"苗圃计划"项目（2025—2027）及南京大学人才引进科研启动经费（2024—2027）。入选江苏省"双创博士"、南京大学"苗圃计划"首批资助对象，曾获教育部"博士研究生国家奖学金"。担任 ACS Energy Letters、Carbon Energy 等学术期刊审稿人。
